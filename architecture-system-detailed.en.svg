<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">AE WPM System Architecture — Detailed</title>
  <desc id="desc">Detailed view of the browser frontend, Apache edge, Django APIs and services, SQL Server, and external identity and service integrations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2874a6"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#718096"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #183247; }
      .title { font-size: 25px; font-weight: 700; }
      .group { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .sub { font-size: 12px; fill: #496273; }
      .flow { fill: none; stroke: #2874a6; stroke-width: 2.7; marker-end: url(#arrow); }
      .ext { fill: none; stroke: #718096; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-gray); }
    </style>
